  main {
    width: 100%;
    max-width: 380px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px 24px;
    text-align: center;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 20px; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; display: block; }
  .brand span { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  a.btn {
    display: block;
    padding: 16px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 600;
  }
  a.btn + a.btn { margin-top: 12px; }
  a.primary { background: var(--accent); color: var(--accent-text); }
  a.secondary { border: 1px solid var(--border); color: var(--text); background: rgba(255,255,255,0.08); }
  a.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  small.note { display: block; margin-top: 20px; color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
  .credits {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.9rem;
  }
  .credits img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; }
  .credits strong { color: var(--text); font-weight: 600; }
</style>
