<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instalar app</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1c1e21;
    --muted: #5f6670;
    --accent: #0a6cff;
    --accent-text: #ffffff;
    --border: #dfe2e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114;
      --surface: #1a1c21;
      --text: #f1f2f4;
      --muted: #9aa1ab;
      --accent: #4c94ff;
      --accent-text: #08111f;
      --border: #2b2e35;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  a.btn {
    display: block;
    padding: 16px;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 14px;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 600;
  }
  a.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  small { display: block; margin-top: 20px; color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
</style>
</head>
<body>
  <main>
    <h1>Instalar app</h1>
    <p>Toca el botón para iniciar la instalación en tu iPhone o iPad.</p>
    <a class="btn" href="itms-services://?action=download-manifest&amp;url=https://raw.githubusercontent.com/davidum19/Delt4-OTA/refs/heads/main/beihang/manifest.plist">Instalar</a>
    <small>Ábrelo en Safari. Si lo abriste desde WhatsApp, Instagram u otra app, usa la opción "Abrir en Safari".</small>
  </main>
</body>
</html>
